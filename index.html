<script>
  // ───── Webly runtime config ─────
  window.__WEBLY__ = {
    projectId: "ae530924-faf2-4547-ae7f-aea5a38307c8",
    apiBase: "https://wxphtsgezburjqoqiqqo.supabase.co/functions/v1/webly-app-api/ae530924-faf2-4547-ae7f-aea5a38307c8",
    proxyBase: "https://wxphtsgezburjqoqiqqo.supabase.co/functions/v1/webly-proxy/ae530924-faf2-4547-ae7f-aea5a38307c8",
  };
  window.__SUPABASE_CONFIG__ = null;

  // ───── Session id for app data ownership ─────
  if (!localStorage.getItem('webly_session')) {
    localStorage.setItem('webly_session', 'sess_' + Math.random().toString(36).slice(2) + Date.now().toString(36));
  }
  const _sess = localStorage.getItem('webly_session');

  // ───── Single fetch interceptor: rewrite /api/data/* and /api/proxy/* ─────
  (function(){
    const origFetch = window.fetch.bind(window);
    function aliasField(obj, target, sources){
      if (!obj || typeof obj !== 'object') return;
      if (obj[target] != null) return;
      for (const s of sources) { if (obj[s] != null) { obj[target] = obj[s]; return; } }
    }
    function normalizeRecord(r){
      if (!r || typeof r !== 'object') return r;
      // Cross-name aliases so AI-generated apps don't crash on missing fields
      aliasField(r, 'name',        ['title','label','product_name','heading']);
      aliasField(r, 'title',       ['name','label']);
      aliasField(r, 'image',       ['image_url','img','imageUrl','photo','picture','thumbnail']);
      aliasField(r, 'image_url',   ['image','img','imageUrl','photo','picture','thumbnail']);
      aliasField(r, 'imageUrl',    ['image_url','image']);
      aliasField(r, 'description', ['desc','details','body','content']);
      aliasField(r, 'price',       ['cost','amount']);
      aliasField(r, 'category',    ['type','tag','collection']);
      return r;
    }
    async function maybeNormalize(res){
      try {
        const ct = res.headers.get('content-type') || '';
        if (!ct.includes('application/json')) return res;
        const cloned = res.clone();
        const data = await cloned.json();
        let next;
        if (Array.isArray(data)) next = data.map(normalizeRecord);
        else next = normalizeRecord(data);
        return new Response(JSON.stringify(next), { status: res.status, statusText: res.statusText, headers: res.headers });
      } catch(_){ return res; }
    }
    window.fetch = function(input, init){
      try {
        let url = typeof input === 'string' ? input : (input && input.url) || '';
        let isApiData = false;
        let newInput = input;
        if (typeof url === 'string') {
          if (url.startsWith('/api/data/')) {
            const newUrl = window.__WEBLY__.apiBase + '/data' + url.replace(/^\/api\/data/, '');
            newInput = (typeof input === 'string') ? newUrl : new Request(newUrl, input);
            isApiData = true;
          } else if (url.startsWith('/api/proxy/')) {
            const newUrl = window.__WEBLY__.proxyBase + url.replace(/^\/api\/proxy/, '');
            newInput = (typeof input === 'string') ? newUrl : new Request(newUrl, input);
          }
        }
        init = init || {};
        const headers = new Headers(init.headers || (typeof input !== 'string' ? input.headers : undefined));
        if (!headers.has('x-webly-session')) headers.set('x-webly-session', _sess);
        init.headers = headers;
        const p = origFetch(newInput, init);
        return isApiData ? p.then(maybeNormalize) : p;
      } catch(_) {
        return origFetch(input, init);
      }
    };
  })();

  // ───── Built-in Supabase-compatible client (always available) ─────
  // Generated apps can call window.supabase.from('x').select() with ZERO setup.
  // - If the user linked their own Supabase project (via "اتصالات"), we use it.
  // - Otherwise we expose a stub that proxies CRUD to /api/data/<table>.
  // This guarantees no app ever shows "لم يتم تكوين قاعدة البيانات".
  (function(){
    function buildQuery(table){
      const filters = [];
      const state = { order: null, limit: null, single: false, range: null };
      const api = {};
      function clone(){ return Object.assign({}, api); }
      api.select = function(){ return clone(); };
      api.eq      = function(col, val){ filters.push({ op:'eq', col, val }); return clone(); };
      api.neq     = function(col, val){ filters.push({ op:'neq', col, val }); return clone(); };
      api.gt      = function(col, val){ filters.push({ op:'gt', col, val }); return clone(); };
      api.gte     = function(col, val){ filters.push({ op:'gte', col, val }); return clone(); };
      api.lt      = function(col, val){ filters.push({ op:'lt', col, val }); return clone(); };
      api.lte     = function(col, val){ filters.push({ op:'lte', col, val }); return clone(); };
      api.like    = function(col, val){ filters.push({ op:'like', col, val }); return clone(); };
      api.ilike   = function(col, val){ filters.push({ op:'ilike', col, val }); return clone(); };
      api['in']   = function(col, vals){ filters.push({ op:'in', col, vals }); return clone(); };
      api.match   = function(obj){ Object.keys(obj||{}).forEach(function(k){ filters.push({ op:'eq', col:k, val:obj[k] }); }); return clone(); };
      api.order   = function(col, opts){ state.order = { col: col, asc: !(opts && opts.ascending === false) }; return clone(); };
      api.limit   = function(n){ state.limit = n; return clone(); };
      api.range   = function(from, to){ state.range = [from, to]; return clone(); };
      api.single  = function(){ state.single = true; return clone(); };
      api.maybeSingle = function(){ state.single = true; return clone(); };

      function applyFilters(rows){
        let out = rows.slice();
        for (const f of filters) {
          if (f.op === 'eq')  out = out.filter(function(r){ return r && r[f.col] == f.val; });
          else if (f.op === 'neq') out = out.filter(function(r){ return r && r[f.col] != f.val; });
          else if (f.op === 'gt')  out = out.filter(function(r){ return r && r[f.col] >  f.val; });
          else if (f.op === 'gte') out = out.filter(function(r){ return r && r[f.col] >= f.val; });
          else if (f.op === 'lt')  out = out.filter(function(r){ return r && r[f.col] <  f.val; });
          else if (f.op === 'lte') out = out.filter(function(r){ return r && r[f.col] <= f.val; });
          else if (f.op === 'like' || f.op === 'ilike') {
            const pat = String(f.val).replace(/%/g,'.*').replace(/_/g,'.');
            const re = new RegExp('^'+pat+'$', f.op === 'ilike' ? 'i' : '');
            out = out.filter(function(r){ return r && re.test(String(r[f.col] ?? '')); });
          } else if (f.op === 'in') {
            out = out.filter(function(r){ return r && f.vals && f.vals.indexOf(r[f.col]) !== -1; });
          }
        }
        if (state.order) {
          const c = state.order.col, asc = state.order.asc;
          out.sort(function(a,b){ const x=a&&a[c], y=b&&b[c]; if (x===y) return 0; return (x>y?1:-1) * (asc?1:-1); });
        }
        if (state.range) out = out.slice(state.range[0], state.range[1]+1);
        if (state.limit != null) out = out.slice(0, state.limit);
        return out;
      }

      // Each terminal operation returns a Thenable so awaiting the chain works.
      function exec(method, body){
        const url = '/api/data/' + encodeURIComponent(table);
        return new Promise(function(resolve){
          const opts = { method: method, headers: { 'Content-Type': 'application/json' } };
          if (body !== undefined) opts.body = JSON.stringify(body);
          fetch(url, opts).then(function(r){ return r.json().then(function(j){ return { ok: r.ok, status: r.status, j: j }; }).catch(function(){ return { ok: r.ok, status: r.status, j: null }; }); })
            .then(function(res){
              if (!res.ok) return resolve({ data: null, error: { message: (res.j && res.j.error) || ('HTTP ' + res.status) }, status: res.status });
              let data = res.j;
              if (method === 'GET' && Array.isArray(data)) data = applyFilters(data);
              if (state.single) data = (Array.isArray(data) ? data[0] : data) || null;
              resolve({ data: data, error: null, status: res.status });
            }).catch(function(e){ resolve({ data: null, error: { message: String(e && e.message || e) } }); });
        });
      }

      // Make the chain itself awaitable (for SELECT after filters)
      api.then = function(onF, onR){ return exec('GET').then(onF, onR); };

      // INSERT
      api.insert = function(values){
        const payload = Array.isArray(values) ? values : [values];
        const p = Promise.all(payload.map(function(v){ return exec('POST', v); }))
          .then(function(results){
            const errs = results.filter(function(r){ return r.error; });
            if (errs.length) return { data: null, error: errs[0].error };
            const data = results.map(function(r){ return r.data; });
            return { data: state.single ? data[0] : data, error: null };
          });
        return Object.assign(p, { select: function(){ return p; }, single: function(){ state.single = true; return p; } });
      };

      // UPDATE
      api.update = function(values){
        const p = exec('GET').then(function(res){
          if (res.error) return res;
          const rows = Array.isArray(res.data) ? res.data : (res.data ? [res.data] : []);
          if (!rows.length) return { data: state.single ? null : [], error: null };
          return Promise.all(rows.map(function(r){
            const id = r && (r.id || r._id);
            if (!id) return { data: null, error: { message: 'row missing id' } };
            return new Promise(function(resolve){
              fetch('/api/data/' + encodeURIComponent(table) + '/' + encodeURIComponent(id), {
                method: 'PUT', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(Object.assign({}, r, values)),
              }).then(function(rr){ return rr.json().then(function(j){ return { ok: rr.ok, j: j }; }); })
                .then(function(rr){ resolve(rr.ok ? { data: rr.j, error: null } : { data: null, error: { message: (rr.j && rr.j.error) || 'update failed' } }); })
                .catch(function(e){ resolve({ data: null, error: { message: String(e) } }); });
            });
          })).then(function(results){
            const errs = results.filter(function(r){ return r.error; });
            if (errs.length) return { data: null, error: errs[0].error };
            const data = results.map(function(r){ return r.data; });
            return { data: state.single ? data[0] : data, error: null };
          });
        });
        return Object.assign(p, { select: function(){ return p; }, single: function(){ state.single = true; return p; }, eq: api.eq });
      };

      // DELETE
      api.delete = function(){
        const p = exec('GET').then(function(res){
          if (res.error) return res;
          const rows = Array.isArray(res.data) ? res.data : (res.data ? [res.data] : []);
          return Promise.all(rows.map(function(r){
            const id = r && (r.id || r._id);
            if (!id) return { ok: true };
            return fetch('/api/data/' + encodeURIComponent(table) + '/' + encodeURIComponent(id), { method: 'DELETE' });
          })).then(function(){ return { data: rows, error: null }; });
        });
        return Object.assign(p, { eq: api.eq });
      };

      api.upsert = api.insert;
      return api;
    }

    function makeWeblyDataClient(){
      const noopSub = { subscribe: function(){ return { unsubscribe: function(){} }; }, unsubscribe: function(){} };
      const auth = {
        getUser:    function(){ return Promise.resolve({ data: { user: null }, error: null }); },
        getSession: function(){ return Promise.resolve({ data: { session: null }, error: null }); },
        signInWithPassword: function(){ return Promise.resolve({ data: { user: null, session: null }, error: { message: 'auth not configured' } }); },
        signUp:     function(){ return Promise.resolve({ data: { user: null, session: null }, error: { message: 'auth not configured' } }); },
        signOut:    function(){ return Promise.resolve({ error: null }); },
        onAuthStateChange: function(){ return { data: { subscription: { unsubscribe: function(){} } } }; },
      };
      const storage = {
        from: function(){ return {
          upload: function(){ return Promise.resolve({ data: null, error: { message: 'storage not configured' } }); },
          getPublicUrl: function(p){ return { data: { publicUrl: '/api/data/_files/' + p } }; },
          remove: function(){ return Promise.resolve({ data: null, error: null }); },
        }; },
      };
      return {
        from: function(table){ return buildQuery(table); },
        auth: auth,
        storage: storage,
        channel: function(){ return { on: function(){ return this; }, subscribe: function(){ return noopSub; } }; },
        removeChannel: function(){},
        rpc: function(){ return Promise.resolve({ data: null, error: { message: 'rpc not available — use /api/data/*' } }); },
      };
    }

    // Always expose a working client. Real Supabase is loaded lazily only if linked.
    window.supabase = makeWeblyDataClient();
    window.__WEBLY_DB_READY__ = true;
    // Expose factory so app code that does createClient(url,key) still works.
    window.__webly_createClient = function(){ return window.supabase; };
  })();

  // ───── Safety net: hide AI-generated "DB not configured" error banners ─────
  // Uses MutationObserver to catch banners that appear AFTER user interaction
  // (e.g. inside a submit handler), not just on initial load.
  (function(){
    const BLOCKED = [
      'لم يتم تكوين قاعدة البيانات',
      'يرجى ربط الخدمة',
      'Supabase is not configured',
      'Database not configured',
      'لم يتم تكوين Supabase',
    ];
    function isBlocked(text){
      if (!text) return false;
      for (let i = 0; i < BLOCKED.length; i++) if (text.indexOf(BLOCKED[i]) !== -1) return true;
      return false;
    }
    function scrubNode(node){
      try {
        if (!node || node.nodeType !== 1) return;
        const text = node.innerText || node.textContent || '';
        if (!isBlocked(text)) return;
        // Walk up to find the smallest ancestor whose text is just the banner
        let target = node;
        let parent = node.parentElement;
        while (parent && parent !== document.body) {
          const ptext = (parent.innerText || parent.textContent || '').trim();
          // If parent has roughly the same text (banner is its main content), keep climbing
          if (ptext.length < text.length + 80 && isBlocked(ptext)) {
            target = parent;
            parent = parent.parentElement;
          } else break;
        }
        // Replace banner with a friendly inline note instead of removing entirely
        const note = document.createElement('div');
        note.setAttribute('data-webly-replaced', '1');
        note.style.cssText = 'padding:12px 16px;border-radius:12px;background:rgba(139,92,246,.08);border:1px solid rgba(139,92,246,.25);color:#c4b5fd;font-size:13px;text-align:center;margin:8px 0;font-family:Cairo,Inter,system-ui,sans-serif';
        note.textContent = '✨ قاعدة البيانات الافتراضية مفعّلة — يمكنك المتابعة.';
        target.parentNode && target.parentNode.replaceChild(note, target);
      } catch(_) {}
    }
    function scrubAll(root){
      try {
        const r = root || document.body;
        if (!r) return;
        // Quick check: nothing to do if body text doesn't contain any banner
        const bodyText = r.innerText || r.textContent || '';
        if (!isBlocked(bodyText)) return;
        // Find leaf-ish elements containing the text
        const walker = document.createTreeWalker(r, NodeFilter.SHOW_ELEMENT, null);
        const candidates = [];
        let n = walker.nextNode();
        while (n) {
          if (n.getAttribute && n.getAttribute('data-webly-replaced')) { n = walker.nextNode(); continue; }
          const t = n.innerText || n.textContent || '';
          if (isBlocked(t) && t.length < 400) candidates.push(n);
          n = walker.nextNode();
        }
        // Pick the deepest matches (smallest containers first)
        candidates.sort(function(a,b){ return (b.children?b.children.length:0) - (a.children?a.children.length:0); });
        for (let i = 0; i < candidates.length; i++) scrubNode(candidates[i]);
      } catch(_) {}
    }
    function start(){
      scrubAll();
      try {
        const obs = new MutationObserver(function(mutations){
          for (let i = 0; i < mutations.length; i++) {
            const m = mutations[i];
            if (m.addedNodes && m.addedNodes.length) { scrubAll(); return; }
            if (m.type === 'characterData') { scrubAll(); return; }
          }
        });
        obs.observe(document.body, { childList: true, subtree: true, characterData: true });
      } catch(_) {}
    }
    if (document.readyState === 'complete' || document.readyState === 'interactive') setTimeout(start, 300);
    else window.addEventListener('DOMContentLoaded', function(){ setTimeout(start, 300); });
  })();
</script>

          const t = babel.types;
          return { visitor: {
            ExportNamedDeclaration(p) {
              const node = p.node;
              if (node.declaration) {
                const decl = node.declaration;
                if ((t.isFunctionDeclaration(decl) || t.isClassDeclaration(decl)) && decl.id && decl.id.name === exportName) found = true;
                if (t.isVariableDeclaration(decl)) {
                  for (const d of decl.declarations) if (t.isIdentifier(d.id) && d.id.name === exportName) found = true;
                }
              }
              for (const s of node.specifiers || []) {
                const exported = s.exported && (s.exported.name || s.exported.value);
                if (exported === exportName) found = true;
              }
            },
          }};
        }],
      });
    } catch (_) {
      return code.indexOf('export') !== -1 && code.indexOf(exportName) !== -1;
    }
    return found;
  }

  // CSS imports → JS module that injects a <style> tag and exports {}
  function makeCssModule(cssText, path) {
    const safe = JSON.stringify(cssText);
    return [
      "const __css = " + safe + ";",
      "const __style = document.createElement('style');",
      "__style.setAttribute('data-webly-css', " + JSON.stringify(path) + ");",
      "__style.textContent = __css;",
      "document.head.appendChild(__style);",
      "export default __css;",
    ].join('\n');
  }

  // Match import / export-from / dynamic import statements (handles single + double quotes)
  const IMPORT_RE = /(\bimport\s+(?:[\w*\s{},$]+\s+from\s+)?|\bexport\s+\*\s+from\s+|\bexport\s+\{[^}]*\}\s+from\s+|\bimport\s*\(\s*)(["'])([^"']+)(\2)/g;

  // Pull named bindings out of an import/export-from prefix like 'import Foo, { a, b as c } from '
  function extractNamedBindings(prefix) {
    const out = [];
    const braceMatch = prefix && prefix.match(/\{([^}]*)\}/);
    if (braceMatch) {
      for (const part of braceMatch[1].split(',')) {
        const seg = part.trim();
        if (!seg) continue;
        const name = seg.split(/\s+as\s+/i)[0].trim();
        if (name && name !== 'default' && /^[A-Za-z_$][A-Za-z0-9_$]*$/.test(name)) out.push(name);
      }
    }
    return out;
  }

  // Track which named bindings each local module must expose so we can
  // backfill missing ones from the default export instead of crashing.
  const requiredExports = Object.create(null);
  function noteRequired(modulePath, names) {
    if (!names.length) return;
    if (!requiredExports[modulePath]) requiredExports[modulePath] = new Set();
    for (const n of names) requiredExports[modulePath].add(n);
  }

  async function loadModule(path) {
    if (moduleCache[path]) return moduleCache[path];
    const src = FILES[path];
    if (src === undefined) throw new Error('Module not found: ' + path);

    let code;
    if (path.endsWith('.css')) {
      code = makeCssModule(src, path);
    } else {
      code = transformJs(src, path);

      // Find every relative dep and pre-load it (also note named bindings consumers want)
      const deps = [];
      let m;
      const re = new RegExp(IMPORT_RE.source, 'g');
      while ((m = re.exec(code)) !== null) {
        const prefix = m[1];
        const spec = m[3];
        const resolved = resolvePath(path, spec);
        if (resolved) {
          deps.push({ spec, resolved });
          noteRequired(resolved, extractNamedBindings(prefix));
        }
      }
      const depUrls = {};
      for (const d of deps) {
        depUrls[d.spec] = await loadModule(d.resolved);
      }
      const re2 = new RegExp(IMPORT_RE.source, 'g');
      code = code.replace(re2, function(_full, prefix, q, spec, q2){
        if (depUrls[spec]) return prefix + q + depUrls[spec] + q2;
        return _full;
      });

      // Shim 1: ensure a default export exists so 'import X from "./mod"' never fails.
      const hasDefault = /export\s+default\b/.test(code)
        || /export\s*\{[^}]*\bdefault\b[^}]*\}/.test(code)
        || /export\s*\{[^}]*\bas\s+default\b[^}]*\}/.test(code);
      if (!hasDefault) {
        code += "\n;export default {};\n";
      }

      // Named local imports are converted to namespace imports above, so we no
      // longer mutate a module's export table here. Mutating exports caused hard
      // browser syntax errors like "Duplicate export of 'seedProducts'".
    }

    const blob = new Blob([code], { type: 'text/javascript' });
    const url = URL.createObjectURL(blob);
    moduleCache[path] = url;
    return url;
  }

  // Pre-pass: scan every file's raw source so that requiredExports is fully
  // populated BEFORE any module is transformed/cached. Without this, a module
  // loaded earlier than one of its consumers wouldn't get the backfill.
  function prescanRequiredExports() {
    for (const filePath of Object.keys(FILES)) {
      if (!/\.(jsx?|tsx?)$/.test(filePath)) continue;
      const code = FILES[filePath];
      const re = new RegExp(IMPORT_RE.source, 'g');
      let m;
      while ((m = re.exec(code)) !== null) {
        const prefix = m[1];
        const spec = m[3];
        const resolved = resolvePath(filePath, spec);
        if (resolved) noteRequired(resolved, extractNamedBindings(prefix));
      }
    }
  }

  (async () => {
    try {
      prescanRequiredExports();
      const entryUrl = await loadModule(ENTRY);
      await import(entryUrl);
    } catch (err) {
      console.error('[Webly]', err);
      const msg = (err && err.stack) ? err.stack : String(err);
      document.getElementById('root').innerHTML =
        '<div style="padding:24px;font-family:ui-monospace,monospace;direction:ltr;text-align:left;min-height:100vh;background:#0f172a">' +
        '<h2 style="color:#f87171;margin:0 0 12px">Webly Runtime Error</h2>' +
        '<pre style="white-space:pre-wrap;color:#fecaca;background:#1e293b;padding:16px;border-radius:8px;border:1px solid #b91c1c;font-size:13px">' +
        msg.replace(/[&<>]/g, function(c){ return ({ '&':'&amp;','<':'&lt;','>':'&gt;' })[c]; }) +
        '</pre></div>';
    }
  })();
</script>
</body>
</html>
